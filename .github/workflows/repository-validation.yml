name: Repository validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate curated sources and omissions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BASE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          validator="$RUNNER_TEMP/validate-publication.py"
          if git cat-file -e "$base:.github/scripts/validate_publication.py" 2>/dev/null; then
            git show "$base:.github/scripts/validate_publication.py" > "$validator"
          else
            cp .github/scripts/validate_publication.py "$validator"
          fi
          python3 "$validator" --base "$base" --head HEAD
      - name: Test omission validation
        shell: bash
        run: |
          python3 -m py_compile scripts/build_browser_views.py scripts/build_public_reference.py
          python3 -m unittest discover -s tests -v
